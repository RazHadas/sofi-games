<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#fff8e8"><title>מקלות קסם — משחק צורות</title>
<style>
:root{--ink:#26354a;--cream:#fff8e8;--purple:#6856d9;--green:#20a86b;--yellow:#e3ac12;--red:#df514b}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Arial",sans-serif;min-height:100dvh}button,select{font:inherit}.app{max-width:900px;margin:auto;padding:12px 14px 24px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:clamp(22px,6vw,34px);font-weight:900}.level{background:#eee9ff;border-radius:20px;padding:7px 12px;color:#5744bc;font-weight:800}.cards{display:grid;grid-template-columns:1fr 1.2fr;gap:12px;margin-top:10px}.card{background:#fff;border-radius:22px;padding:12px;box-shadow:0 3px 14px #382b1510;min-width:0}.card h2{text-align:center;font-size:17px;margin:2px 0 8px}.shape-box{height:clamp(205px,43vh,360px);display:grid;place-items:center;position:relative}.shape-box canvas{width:100%;height:100%}.cam-wrap{height:clamp(205px,43vh,360px);position:relative;border-radius:16px;overflow:hidden;background:#dbe9ec;display:grid;place-items:center}.cam-wrap video,.cam-wrap canvas{position:absolute;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.cam-wrap video{opacity:0}.cam-wrap canvas{width:100%;height:100%}.cam-label{position:absolute;inset:auto 8px 8px;z-index:2;background:#ffffffdd;border-radius:12px;padding:5px 9px;text-align:center;font-size:12px}.score{text-align:center;font-size:clamp(36px,9vw,54px);font-weight:950;line-height:1.15;margin-top:8px}.meter{height:20px;background:#e9e1d4;border-radius:20px;overflow:hidden;margin:8px 10px 4px}.meter i{height:100%;display:block;width:0;background:var(--red);border-radius:20px;transition:width .15s,background .2s}.status{text-align:center;font-weight:750;min-height:25px}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:9px 0}.btn{border:0;border-radius:16px;padding:12px 16px;background:#eee9ff;color:#423599;font-weight:850;box-shadow:0 2px 0 #d8d1f4;cursor:pointer;touch-action:manipulation}.btn.primary{background:var(--purple);color:#fff;box-shadow:0 2px 0 #4938ae}.btn.success{background:#e2f7ec;color:#137746}.btn:active{transform:translateY(1px)}.small{font-size:13px;opacity:.8;text-align:center;margin:10px 0}.settings{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:14px}.settings label{display:flex;gap:6px;align-items:center}.settings input{width:130px;accent-color:var(--purple)}select{border:1px solid #ded8cd;border-radius:10px;padding:6px;background:white}.win{position:fixed;inset:0;background:#fff5;display:none;place-items:center;pointer-events:none;z-index:9;font-size:82px;animation:pop .8s ease}@keyframes pop{0%{transform:scale(.7);opacity:0}25%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:0}}@media(max-width:620px){.app{padding:8px 10px 18px}.cards{gap:8px}.card{padding:8px;border-radius:17px}.card h2{font-size:14px}.shape-box,.cam-wrap{height:clamp(190px,35vh,280px)}.btn{padding:11px 13px}.settings{font-size:12px}}
</style></head>
<body><main class="app"><header class="top"><div class="brand">🪄 מקלות קסם</div><div class="level" id="level">רמה 1 · מתחילים</div></header>
<section class="cards"><article class="card"><h2>בונים צורה כזאת</h2><div class="shape-box"><canvas id="target"></canvas></div><div id="shapeName" style="text-align:center;font-size:24px;font-weight:900"></div></article>
<article class="card"><h2>📷 המשטח שלך</h2><div class="cam-wrap"><video id="video" playsinline muted></video><canvas id="view"></canvas><div class="cam-label" id="camLabel">מצב הדגמה · לחצו כדי להפעיל מצלמה</div></div></article></section>
<div class="score" id="score">0%</div><div class="meter"><i id="meter"></i></div><div class="status" id="status">בואו נרכיב את הצורה מהמקלות!</div>
<div class="actions"><button class="btn" id="prev">◀ הקודמת</button><button class="btn primary" id="camera">📷 הפעלת מצלמה</button><button class="btn" id="next">הבאה ▶</button><button class="btn success" id="sound">🔊 צליל פעיל</button></div>
<div class="settings"><label>רמה <select id="levelSelect"><option value="1">1 · מתחילים</option><option value="2">2 · קל</option><option value="3">3 · בינוני</option><option value="4">4 · מתקדם</option></select></label><label>אחוז הצלחה <input id="threshold" type="range" min="60" max="100" value="90"><b id="thresholdVal">90%</b></label></div>
<p class="small">המקלות יכולים להיות בכל צבע. הניחו את הטלפון כך שהמשטח כולו ייראה, והעניקו לדפדפן הרשאת מצלמה.</p></main><div class="win" id="win">🎉⭐🎉</div>
<script src="./sticks.js"></script>
</body></html>
